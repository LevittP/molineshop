<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;

      background: rgba(8, 18, 32, .85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .title {
      font-size: 21px;
      font-weight: 700;
    }

    .search {
      flex: 1;
      max-width: 500px;
      margin-left: auto;

      padding: 11px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);

      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
    }

    .status {
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
      overflow-y: auto;

      padding: 18px;

      background: rgba(4,12,24,.9);
      border-right: 1px solid rgba(255,255,255,.08);
    }

    .sidebar h2 {
      margin: 0 0 14px;
      font-size: 14px;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game {
      width: 100%;
      padding: 13px 14px;

      border: 1px solid transparent;
      border-radius: 11px;

      background: rgba(255,255,255,.045);
      color: white;

      cursor: pointer;
      text-align: left;
    }

    .game:hover {
      background: rgba(255,255,255,.09);
    }

    .game.active {
      background: rgba(70,130,220,.18);
      border-color: rgba(100,170,255,.35);
    }

    .game-name {
      font-size: 14px;
      font-weight: 600;
    }

    .game-file {
      margin-top: 4px;
      font-size: 11px;
      color: rgba(255,255,255,.4);
    }

    .content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      background: #000;
    }

    #gameFrame {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;
      background: white;
    }

    .welcome {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      text-align: center;
      color: rgba(255,255,255,.6);
    }

    .welcome h1 {
      margin: 0 0 10px;
      color: white;
    }

    .loading {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: #000;
      z-index: 10;
    }

    .loading.visible {
      display: flex;
    }

    .spinner {
      width: 35px;
      height: 35px;

      border: 3px solid rgba(255,255,255,.15);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 12px;
    }

    .error {
      margin-top: 15px;
      padding: 12px;

      border-radius: 10px;

      background: rgba(255,60,60,.1);
      border: 1px solid rgba(255,80,80,.25);

      color: #ffaaaa;
      font-size: 12px;
      line-height: 1.4;
    }

    @media(max-width:700px) {
      .sidebar {
        width: 220px;
      }

      .title {
        display: none;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

    <div class="title">
      Game Library
    </div>

    <input
      id="search"
      class="search"
      placeholder="Search games..."
      autocomplete="off"
    >

    <div id="status" class="status">
      Loading...
    </div>

  </div>

  <div class="layout">

    <aside class="sidebar">

      <h2>Games</h2>

      <div id="games" class="games"></div>

      <div id="error"></div>

    </aside>

    <main class="content">

      <div id="welcome" class="welcome">

        <h1>Select a game</h1>

        <p>
          Choose a game from the list.
        </p>

      </div>

      <div id="loading" class="loading">

        <div>
          <div class="spinner"></div>

          <div class="loading-text">
            Loading game...
          </div>
        </div>

      </div>

      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
      </iframe>

    </main>

  </div>

  <script>

    const ARCHIVE_ITEM = "ugsfiles";

    const METADATA_URL =
      "https://archive.org/metadata/" + ARCHIVE_ITEM;

    const FILE_BASE =
      "https://dn721907.ca.archive.org/0/items/" +
      ARCHIVE_ITEM + "/";

    const gamesContainer =
      document.getElementById("games");

    const search =
      document.getElementById("search");

    const status =
      document.getElementById("status");

    const errorBox =
      document.getElementById("error");

    const iframe =
      document.getElementById("gameFrame");

    const welcome =
      document.getElementById("welcome");

    const loading =
      document.getElementById("loading");

    let games = [];

    let selectedGame = null;

    let currentBlobURL = null;


    /*
     * Convert the filename into the name
     * displayed in the game list.
     *
     * cl430.html -> 430
     * cl10min.html -> 10min
     */
    function getDisplayName(filename) {

      let name = filename;

      if (name.toLowerCase().startsWith("cl")) {
        name = name.substring(2);
      }

      if (name.toLowerCase().endsWith(".html")) {
        name = name.substring(
          0,
          name.length - 5
        );
      }

      name = name
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      return name || filename;
    }


    /*
     * Escape text before putting it into innerHTML.
     */
    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
     * Scan Archive.org.
     */
    async function scanArchive() {

      status.textContent =
        "Scanning Archive.org...";

      try {

        const response =
          await fetch(METADATA_URL);

        if (!response.ok) {
          throw new Error(
            "Archive.org returned HTTP " +
            response.status
          );
        }

        const metadata =
          await response.json();

        games = metadata.files
          .map(file => file.name)
          .filter(filename =>
            filename
              .toLowerCase()
              .endsWith(".html")
          )
          .map(filename => ({
            filename: filename,

            name: getDisplayName(filename),

            url:
              FILE_BASE +
              encodeURIComponent(filename)
          }))
          .sort((a, b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              {
                numeric: true,
                sensitivity: "base"
              }
            )
          );

        renderGames();

        status.textContent =
          games.length +
          " games found";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Failed to scan";

        errorBox.innerHTML =
          '<div class="error">' +
          escapeHTML(error.message) +
          '</div>';
      }
    }


    /*
     * Render game buttons.
     */
    function renderGames(filter = "") {

      gamesContainer.innerHTML = "";

      const query =
        filter.toLowerCase().trim();

      const visibleGames =
        games.filter(game =>
          game.name
            .toLowerCase()
            .includes(query)
          ||
          game.filename
            .toLowerCase()
            .includes(query)
        );

      if (!visibleGames.length) {

        gamesContainer.innerHTML =
          '<div style="color:rgba(255,255,255,.4);padding:10px">' +
          'No games found.' +
          '</div>';

        return;
      }

      for (const game of visibleGames) {

        const button =
          document.createElement("button");

        button.className = "game";

        if (
          selectedGame &&
          selectedGame.filename ===
          game.filename
        ) {
          button.classList.add("active");
        }

        button.innerHTML = `
          <div class="game-name">
            ${escapeHTML(game.name)}
          </div>

          <div class="game-file">
            ${escapeHTML(game.filename)}
          </div>
        `;

        button.onclick = () => {
          launchGame(game);
        };

        gamesContainer.appendChild(button);
      }
    }


    /*
     * Load the game's HTML source.
     *
     * Instead of putting the Archive URL directly
     * into the iframe, we:
     *
     * 1. fetch the HTML
     * 2. turn it into a Blob
     * 3. tell the browser it is text/html
     * 4. create a local blob URL
     * 5. put that URL into the iframe
     *
     * This prevents Archive.org's text/plain
     * response from displaying the source code.
     */
    async function launchGame(game) {

      selectedGame = game;

      renderGames(search.value);

      welcome.style.display = "none";

      iframe.style.display = "none";

      loading.classList.add("visible");

      errorBox.innerHTML = "";

      try {

        /*
         * Clean up the previous game.
         */
        if (currentBlobURL) {

          URL.revokeObjectURL(
            currentBlobURL
          );

          currentBlobURL = null;
        }


        /*
         * Download the actual HTML.
         */
        const response =
          await fetch(game.url, {
            cache: "no-store"
          });

        if (!response.ok) {

          throw new Error(
            "Could not download " +
            game.filename +
            " (HTTP " +
            response.status +
            ")"
          );
        }


        /*
         * Read the HTML source.
         */
        let html =
          await response.text();


        /*
         * Make relative links work.
         *
         * For example:
         *
         * <script src="game.js">
         *
         * will resolve against the Archive.org
         * directory instead of your GitHub site.
         */
        const baseTag =
          `<base href="${escapeAttribute(
            FILE_BASE
          )}">`;

        if (
          /<head[\s>]/i.test(html)
        ) {

          html = html.replace(
            /<head([^>]*)>/i,
            `<head$1>${baseTag}`
          );

        } else {

          html =
            baseTag +
            html;
        }


        /*
         * Convert the source into an actual HTML
         * document.
         */
        const blob =
          new Blob(
            [html],
            {
              type: "text/html"
            }
          );


        /*
         * Create a local URL for the HTML.
         */
        currentBlobURL =
          URL.createObjectURL(blob);


        /*
         * Put the local HTML document into
         * the iframe.
         */
        iframe.src =
          currentBlobURL;

        iframe.onload = () => {

          loading.classList.remove(
            "visible"
          );

          iframe.style.display =
            "block";
        };

      } catch (error) {

        console.error(
          "Game loading error:",
          error
        );

        loading.classList.remove(
          "visible"
        );

        errorBox.innerHTML = `
          <div class="error">
            <strong>Game failed to load</strong><br><br>
            ${escapeHTML(error.message)}
          </div>
        `;
      }
    }


    /*
     * Escape a value used inside an HTML
     * attribute.
     */
    function escapeAttribute(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }


    /*
     * Search.
     */
    search.addEventListener(
      "input",
      () => {
        renderGames(search.value);
      }
    );


    /*
     * Start scanning.
     */
    scanArchive();

  </script>

</body>
</html>
