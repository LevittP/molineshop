<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;

      background: rgba(8, 18, 32, 0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      max-width: 500px;
      margin-left: auto;

      padding: 11px 15px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;

      background: rgba(255,255,255,0.06);
      color: white;
      outline: none;
      font-size: 14px;
    }

    .search:focus {
      border-color: rgba(100,170,255,0.6);
      background: rgba(255,255,255,0.09);
    }

    .status {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
      overflow-y: auto;

      padding: 18px;

      background: rgba(4, 12, 24, 0.82);
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar h2 {
      margin: 0 0 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game {
      width: 100%;
      padding: 13px 14px;

      border: 1px solid transparent;
      border-radius: 11px;

      background: rgba(255,255,255,0.045);
      color: white;

      cursor: pointer;
      text-align: left;
      transition: 0.15s ease;
    }

    .game:hover {
      background: rgba(255,255,255,0.09);
      transform: translateX(2px);
    }

    .game.active {
      background: rgba(70,130,220,0.18);
      border-color: rgba(100,170,255,0.35);
    }

    .game-name {
      font-size: 14px;
      font-weight: 600;
    }

    .game-file {
      margin-top: 4px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    .content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      background: #000;
    }

    .welcome {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      text-align: center;
      color: rgba(255,255,255,0.65);
      padding: 30px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      color: white;
      font-size: 30px;
    }

    .welcome p {
      max-width: 500px;
      line-height: 1.5;
    }

    #gameFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: #000;
      z-index: 5;
    }

    .loading.visible {
      display: flex;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 14px;

      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: white;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      padding: 18px;
      margin: 20px;

      border-radius: 12px;

      background: rgba(255,60,60,0.1);
      border: 1px solid rgba(255,80,80,0.25);

      color: #ffaaaa;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 220px;
      }

      .title {
        display: none;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="title">Game Library</div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Search games..."
      autocomplete="off"
    >

    <div id="status" class="status">
      Loading games...
    </div>
  </div>

  <div class="layout">

    <aside class="sidebar">
      <h2>Games</h2>

      <div id="games" class="games"></div>

      <div id="error"></div>
    </aside>

    <main class="content">

      <div id="welcome" class="welcome">
        <h1>Select a game</h1>
        <p>
          Choose a game from the library. The game will run inside this page
          instead of redirecting you somewhere else.
        </p>
      </div>

      <div id="loading" class="loading">
        <div class="loading-box">
          <div class="spinner"></div>
          <div>Loading game...</div>
        </div>
      </div>

      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
      </iframe>

    </main>
  </div>

  <script>
    const ARCHIVE_ITEM = "ugsfiles";

    const ARCHIVE_METADATA =
      "https://archive.org/metadata/" + ARCHIVE_ITEM;

    const ARCHIVE_FILE_BASE =
      "https://dn721907.ca.archive.org/0/items/" + ARCHIVE_ITEM + "/";

    const gamesContainer = document.getElementById("games");
    const searchInput = document.getElementById("search");
    const status = document.getElementById("status");
    const errorContainer = document.getElementById("error");

    const gameFrame = document.getElementById("gameFrame");
    const welcome = document.getElementById("welcome");
    const loading = document.getElementById("loading");

    let games = [];
    let selectedGame = null;

    function displayName(filename) {
      let name = filename;

      /*
       * Files beginning with "cl" have that prefix
       * hidden from the displayed game name.
       *
       * cl10min.html -> 10min
       * cl430.html   -> 430
       */
      if (name.toLowerCase().startsWith("cl")) {
        name = name.substring(2);
      }

      if (name.toLowerCase().endsWith(".html")) {
        name = name.substring(0, name.length - 5);
      }

      /*
       * Turn common filename separators into spaces.
       */
      name = name
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      return name || filename;
    }

    function sortGames(a, b) {
      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );
    }

    async function scanArchive() {
      status.textContent = "Scanning Archive.org...";

      try {
        const response = await fetch(ARCHIVE_METADATA, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "Archive.org returned HTTP " + response.status
          );
        }

        const metadata = await response.json();

        if (!metadata.files) {
          throw new Error("No files were returned by Archive.org.");
        }

        games = metadata.files
          .map(file => file.name)
          .filter(name => {
            return (
              typeof name === "string" &&
              name.toLowerCase().endsWith(".html")
            );
          })
          .map(filename => ({
            filename,
            name: displayName(filename),
            url: ARCHIVE_FILE_BASE +
              encodeURIComponent(filename)
          }))
          .sort(sortGames);

        renderGames();

        status.textContent =
          games.length + " game" +
          (games.length === 1 ? "" : "s") +
          " found";

      } catch (error) {
        console.error(error);

        status.textContent = "Failed to scan";

        errorContainer.innerHTML = `
          <div class="error">
            Could not scan the Archive.org files.<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function renderGames(filter = "") {
      gamesContainer.innerHTML = "";

      const query = filter.trim().toLowerCase();

      const visibleGames = games.filter(game => {
        return (
          game.name.toLowerCase().includes(query) ||
          game.filename.toLowerCase().includes(query)
        );
      });

      if (visibleGames.length === 0) {
        gamesContainer.innerHTML = `
          <div style="
            padding:12px;
            color:rgba(255,255,255,.4);
            font-size:13px;
          ">
            No games found.
          </div>
        `;

        return;
      }

      for (const game of visibleGames) {
        const button = document.createElement("button");

        button.className = "game";

        if (
          selectedGame &&
          selectedGame.filename === game.filename
        ) {
          button.classList.add("active");
        }

        button.innerHTML = `
          <div class="game-name">
            ${escapeHtml(game.name)}
          </div>

          <div class="game-file">
            ${escapeHtml(game.filename)}
          </div>
        `;

        button.addEventListener("click", () => {
          launchGame(game);
        });

        gamesContainer.appendChild(button);
      }
    }

    function launchGame(game) {
      selectedGame = game;

      renderGames(searchInput.value);

      welcome.style.display = "none";
      gameFrame.style.display = "none";

      loading.classList.add("visible");

      /*
       * Load the actual HTML file inside an iframe.
       *
       * This does NOT redirect the main page.
       */
      gameFrame.src = game.url;

      gameFrame.onload = () => {
        loading.classList.remove("visible");
        gameFrame.style.display = "block";
      };

      gameFrame.onerror = () => {
        loading.classList.remove("visible");

        errorContainer.innerHTML = `
          <div class="error">
            The game could not be loaded.
          </div>
        `;
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    searchInput.addEventListener("input", () => {
      renderGames(searchInput.value);
    });

    scanArchive();
  </script>

</body>
</html>
