<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Games</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    h1 {
      color: #7a0019;
    }

    #file-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .game-button {
      background: #7a0019;
      color: white;
      padding: 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .game-button:hover {
      background: #a00022;
    }

    #game-container {
      display: none;
      width: 100%;
      height: 100vh;
      background: black;
    }

    #game-frame {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: white;
    }

    #back-button {
      width: 100%;
      height: 60px;
      border: none;
      background: #7a0019;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #back-button:hover {
      background: #a00022;
    }

  </style>

</head>

<body>

  <div id="game-list">

```
<div class="header">

  <img
    class="logo"
    src="assets/logo.jpg"
    alt="Logo"
  >

  <h1>G@mes</h1>

  <p>Select a g@me to play.</p>

</div>


<div id="file-list">
  Loading g@mes...
</div>
```

  </div>

  <div id="game-container">

```
<button id="back-button">
  ← Back to G@mes
</button>

<iframe
  id="game-frame"
  sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"
  allowfullscreen>
</iframe>
```

  </div>

  <script>

    const ARCHIVE_URL =
      "https://archive.org/download/ugsfiles/";


    async function loadGames() {

      const fileList =
        document.getElementById("file-list");


      try {

        const response = await fetch(
          "https://archive.org/metadata/ugsfiles"
        );


        const data =
          await response.json();


        const files = data.files

          .map(file => file.name)

          .filter(
            name =>
              name &&
              name.toLowerCase().endsWith(".html")
          )

          .sort();


        fileList.innerHTML = "";


        files.forEach(file => {

          const button =
            document.createElement("div");


          button.className =
            "game-button";


          button.textContent =
            file.replace(/\.html$/i, "");


          button.onclick = function() {

            openGame(file);

          };


          fileList.appendChild(button);

        });


      }

      catch (error) {

        console.error(error);

        fileList.innerHTML =
          "Could not load games.";

      }

    }


    async function openGame(file) {

      const gameList =
        document.getElementById("game-list");


      const gameContainer =
        document.getElementById("game-container");


      const gameFrame =
        document.getElementById("game-frame");


      gameContainer.style.display =
        "block";


      gameList.style.display =
        "none";


      gameFrame.srcdoc =
        "<p style='font-family:Arial;text-align:center;'>Loading game...</p>";


      try {

        const response = await fetch(
          ARCHIVE_URL +
          encodeURIComponent(file)
        );


        if (!response.ok) {

          throw new Error(
            "Failed to download game"
          );

        }


        const html =
          await response.text();


        gameFrame.srcdoc =
          html;


      }

      catch (error) {

        console.error(error);


        gameFrame.srcdoc = `

          <h1 style="font-family:Arial;text-align:center;">
            Could not load game
          </h1>

          <p style="font-family:Arial;text-align:center;">
            ${error.message}
          </p>

        `;

      }

    }


    document
      .getElementById("back-button")
      .onclick = function() {


        document
          .getElementById("game-frame")
          .srcdoc = "";


        document
          .getElementById("game-container")
          .style.display =
          "none";


        document
          .getElementById("game-list")
          .style.display =
          "block";

      };


    loadGames();

  </script>

</body>

</html>
