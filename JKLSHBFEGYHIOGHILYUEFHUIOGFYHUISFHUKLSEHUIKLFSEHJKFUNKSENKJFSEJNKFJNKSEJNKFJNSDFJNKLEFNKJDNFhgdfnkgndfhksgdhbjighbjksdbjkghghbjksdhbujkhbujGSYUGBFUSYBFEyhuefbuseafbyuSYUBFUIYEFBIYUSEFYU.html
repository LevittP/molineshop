<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Games</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #f5f5f5;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* GAME LIST */

    #game-list {

      min-height: 100vh;

    }


    .header {

      background: white;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.1);

    }


    .logo {

      width: 70px;

      height: 70px;

      object-fit: contain;

    }


    h1 {

      color: #7a0019;

      margin-bottom: 10px;

    }


    .header p {

      color: #666;

    }


    /* GAME BUTTONS */

    #file-list {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 15px;

      padding: 30px;

      max-width: 1200px;

      margin: auto;

    }


    .game-button {

      background: #7a0019;

      color: white;

      padding: 20px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      text-align: center;

      transition:
        background .2s,
        transform .2s;

      word-break: break-word;

    }


    .game-button:hover {

      background: #a00022;

      transform:
        translateY(-2px);

    }


    /* GAME PLAYER */

    #game-container {

      display: none;

      width: 100%;

      height: 100vh;

      background: black;

    }


    #game-frame {

      width: 100%;

      height:
        calc(100vh - 60px);

      border: none;

      background: black;

    }


    #back-button {

      width: 100%;

      height: 60px;

      border: none;

      background: #7a0019;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    #back-button:hover {

      background: #a00022;

    }


    /* LOADING */

    #loading {

      text-align: center;

      padding: 40px;

      color: #666;

      font-size: 18px;

    }

  </style>

</head>

<body>

  <!-- ========================= -->

  <!-- GAME LIST -->

  <!-- ========================= -->

  <div id="game-list">

```
<div class="header">


  <img
    class="logo"
    src="assets/logo.jpg"
    alt="Logo"
  >


  <h1>
    Games
  </h1>


  <p>
    Select a game to play.
  </p>


</div>


<div id="loading">

  Loading games...

</div>


<div id="file-list">

</div>
```

  </div>

  <!-- ========================= -->

  <!-- GAME PLAYER -->

  <!-- ========================= -->

  <div id="game-container">

```
<button id="back-button">

  ← Back to Games

</button>


<iframe
  id="game-frame"
  allow="autoplay; fullscreen; gamepad"
  allowfullscreen>
</iframe>
```

  </div>

  <script>


    /*
    ========================================
    INTERNET ARCHIVE SETTINGS
    ========================================
    */


    const ARCHIVE_DOWNLOAD_URL =
      "https://archive.org/download/ugsfiles/";


    const ARCHIVE_METADATA_URL =
      "https://archive.org/metadata/ugsfiles";



    /*
    ========================================
    GET ALL HTML FILES
    ========================================
    */


    async function loadGames() {


      const fileList =
        document.getElementById(
          "file-list"
        );


      const loading =
        document.getElementById(
          "loading"
        );


      try {


        const response =
          await fetch(
            ARCHIVE_METADATA_URL
          );


        if (!response.ok) {

          throw new Error(
            "Could not connect to Internet Archive."
          );

        }


        const data =
          await response.json();



        /*
        Get all filenames
        */


        const files =

          data.files

            .map(
              file =>
                file.name
            )

            .filter(

              name =>

                name &&

                name
                  .toLowerCase()
                  .endsWith(
                    ".html"
                  )

            )

            .sort();



        /*
        Hide loading message
        */


        loading.style.display =
          "none";



        /*
        No games found
        */


        if (
          files.length === 0
        ) {

          fileList.innerHTML =

            "<p>No games found.</p>";

          return;

        }



        /*
        Create game buttons
        */


        files.forEach(
          file => {


            const button =
              document.createElement(
                "div"
              );


            button.className =
              "game-button";


            /*
            Remove .html
            */


            button.textContent =

              file.replace(
                /\.html$/i,
                ""
              );



            /*
            Open game
            */


            button.onclick =

              function() {

                openGame(
                  file
                );

              };



            fileList.appendChild(
              button
            );


          }
        );


      }


      catch (error) {


        console.error(
          error
        );


        loading.textContent =

          "Could not load games.";


      }

    }



    /*
    ========================================
    OPEN GAME
    ========================================
    */


    async function openGame(
      file
    ) {


      const gameList =
        document.getElementById(
          "game-list"
        );


      const gameContainer =
        document.getElementById(
          "game-container"
        );


      const gameFrame =
        document.getElementById(
          "game-frame"
        );



      /*
      Show game player
      */


      gameList.style.display =
        "none";


      gameContainer.style.display =
        "block";



      /*
      Show loading screen
      */


      gameFrame.srcdoc = `

        <!DOCTYPE html>

        <html>

        <body style="
          margin:0;
          background:black;
          color:white;
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          font-family:Arial;
        ">

          <h2>
            Loading game...
          </h2>

        </body>

        </html>

      `;



      try {


        /*
        Get HTML file
        */


        const response =

          await fetch(

            ARCHIVE_DOWNLOAD_URL +

            encodeURIComponent(
              file
            )

          );



        if (!response.ok) {

          throw new Error(
            "Could not load game."
          );

        }



        /*
        Get HTML source
        */


        const html =

          await response.text();



        /*
        Run HTML inside iframe
        */


        gameFrame.srcdoc =
          html;


      }


      catch (error) {


        console.error(
          error
        );


        /*
        Show error
        */


        gameFrame.srcdoc = `

          <!DOCTYPE html>

          <html>

          <body style="
            margin:0;
            background:black;
            color:white;
            text-align:center;
            font-family:Arial;
            padding-top:100px;
          ">

            <h1>
              Game Failed to Load
            </h1>

            <p>
              ${error.message}
            </p>

          </body>

          </html>

        `;

      }

    }



    /*
    ========================================
    BACK BUTTON
    ========================================
    */


    document
      .getElementById(
        "back-button"
      )
      .onclick =

      function() {


        /*
        Stop game
        */


        document
          .getElementById(
            "game-frame"
          )
          .srcdoc = "";



        /*
        Hide player
        */


        document
          .getElementById(
            "game-container"
          )
          .style.display =
          "none";



        /*
        Show game list
        */


        document
          .getElementById(
            "game-list"
          )
          .style.display =
          "block";


      };



    /*
    ========================================
    START
    ========================================
    */


    loadGames();


  </script>

</body>

</html>
