<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Games</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #f5f5f5;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* GAME LIST */

    #game-list {

      min-height: 100vh;

    }


    .header {

      background: white;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 2px 10px
        rgba(0, 0, 0, .1);

    }


    .logo {

      width: 70px;

      height: 70px;

      object-fit: contain;

    }


    h1 {

      color: #7a0019;

      margin-bottom: 10px;

    }


    .header p {

      color: #666;

    }


    /* GAME BUTTONS */

    #file-list {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 15px;

      padding: 30px;

      max-width: 1200px;

      margin: auto;

    }


    .game-button {

      background: #7a0019;

      color: white;

      padding: 20px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      text-align: center;

      transition:
        background .2s,
        transform .2s;

      word-break: break-word;

    }


    .game-button:hover {

      background: #a00022;

      transform:
        translateY(-2px);

    }


    /* GAME PLAYER */

    #game-container {

      display: none;

      width: 100%;

      height: 100vh;

      background: black;

    }


    #game-frame {

      width: 100%;

      height:
        calc(100vh - 60px);

      border: none;

      background: black;

    }


    #back-button {

      width: 100%;

      height: 60px;

      border: none;

      background: #7a0019;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    #back-button:hover {

      background: #a00022;

    }


    /* LOADING */

    #loading {

      text-align: center;

      padding: 40px;

      color: #666;

      font-size: 18px;

    }

  </style>

</head>

<body>

  <!-- ============================ -->

  <!-- GAME LIST -->

  <!-- ============================ -->

  <div id="game-list">

```
<div class="header">


  <img
    class="logo"
    src="assets/logo.jpg"
    alt="Logo"
  >


  <h1>
    Games
  </h1>


  <p>
    Select a game to play.
  </p>


</div>


<div id="loading">

  Loading games...

</div>


<div id="file-list">

</div>
```

  </div>

  <!-- ============================ -->

  <!-- GAME PLAYER -->

  <!-- ============================ -->

  <div id="game-container">

```
<button id="back-button">

  ← Back to Games

</button>


<iframe
  id="game-frame"
  allow="
    autoplay;
    fullscreen;
    gamepad
  "
  allowfullscreen>
</iframe>
```

  </div>

  <!-- ============================ -->

  <!-- JAVASCRIPT -->

  <!-- ============================ -->

  <script
    src="games.js">
  </script>

</body>

</html>
